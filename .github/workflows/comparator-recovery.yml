name: Comparator recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/comparator-recovery.yml]

permissions:
  contents: read

concurrency:
  group: comparator-recovery-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  remaining:
    name: Recover interrupted configurations, batch ${{ matrix.batch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - batch: 0
            configurations: >-
              tensor_operators cell_tensor_bounds korn_symbol periodic_fourier_energy
              spatial_load weighted_space periodic_bv_compactness rescaled_fields
              variational_semigroup
          - batch: 1
            configurations: >-
              uniform_prony_stability dirichlet_cutoff lp_product_coordinates
              periodic_sobolev_bv strip_spectral_edges linear_surrogate periodic_gradient_mean
              spectral_continuity weighted_variation_gap
          - batch: 2
            configurations: >-
              volterra_uniqueness feedforward_fourier_approximation microscopic_green
              prony_convolution time_sobolev_laplace_memory mandel_isometries
              periodic_sobolev_identities strong_multiplication
          - batch: 3
            configurations: >-
              bernstein_geometry fourier_mapping_affine periodic_averaging relaxation_spectrum
              unweighted_response_integral microscopic_solution_family prony_identities
              time_sobolev_memory_uniqueness
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            lean/.elan/toolchains
            lean/.lake
          key: comparator-linux-4.35.0-v2
          fail-on-cache-miss: true
      - name: Prepare Lean and verify sandbox support
        env:
          COMPARATOR_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: bash Verification/ci_setup.sh
      - name: Reserve swap for kernel checks
        run: |
          available_kib=$(df --output=avail / | tail -1)
          if (( available_kib < 18 * 1024 * 1024 )); then
            echo "Insufficient disk space for swap and proof exports" >&2
            exit 1
          fi
          sudo fallocate -l 12G /swapfile-comparator
          sudo chmod 600 /swapfile-comparator
          sudo mkswap /swapfile-comparator
          sudo swapon /swapfile-comparator
          free -m
          df -h .
      - name: Run the remaining sandboxed paranoid checks
        env:
          CONFIGURATIONS: ${{ matrix.configurations }}
        run: |
          read -r -a configurations <<< "$CONFIGURATIONS"
          args=()
          for configuration in "${configurations[@]}"; do
            args+=(--config "$configuration")
          done
          /usr/bin/time -v -o Verification/results/resource-time.log \
            python3 Verification/verify.py comparator "${args[@]}" --keep-going
      - name: Preserve recovered evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparator-recovery-${{ matrix.batch }}
          path: |
            lean/Verification/results/comparator-*
            lean/Verification/results/resource-time.log
          retention-days: 14
