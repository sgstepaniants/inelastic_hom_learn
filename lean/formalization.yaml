    - source: "Remark 4.1, distributional gradient and BV estimate"
      module: "KVApproximation.Analysis.PeriodicSobolevBV"
      comparator_config: "Comparator/periodic_sobolev_bv.json"
      note: "Scalar integrability, Cauchy–Schwarz against unit tests and exponent monotonicity on probability spaces give two Hilbert-fibre estimates. The target may be infinite-dimensional or incomplete."
    - source: "Remark 4.1, smoother coefficient classes"
      module: "KVApproximation.Tensor.SobolevCompactness"
      comparator_config: "Comparator/sobolev_coefficient_compactness.json"
      note: "Frobenius coefficient fields give compact-closure and closed-class compactness results in L². Closure points may have lower regularity than W¹,¹."
    - source: "Remark 4.3, separating scalar Fourier projections"
      module: "KVApproximation.NeuralOperators.FourierProjectionFeatures"
      comparator_config: "Comparator/fourier_projection_features.json"
      note: "Coefficients z/2 and conjugate(z/2) at opposite modes define a scalar Fourier projection recovering Re(z times the channel coefficient), including at frequency zero. Choosing z=1 and z=-i recovers the real and imaginary parts. Fourier uniqueness then identifies the Euclidean L² fields. Empty channel spaces and zero-dimensional cells are included."
    - source: "Remark 4.3, common Fourier observation of a compact family"
      module: "KVApproximation.NeuralOperators.FourierProjectionEvaluation"
      comparator_config: "Comparator/fourier_projection_evaluation.json"
      note: "A finite conjugate-symmetric Fourier projection uniformly approximates evaluation at a prescribed point for a jointly continuous compact family. A normalized positive-mass ball indicator gives the real L² kernel. Uniform bounds for the compact family and almost-everywhere transfer identify the projection with the normalized integral. The approximation is restricted to this continuous family."
    - source: "Remark 4.3, vector-valued ridge approximation"
      module: "KVApproximation.Approximation.VectorRidgeApproximation"
      comparator_config: "Comparator/vector_ridge_approximation.json"
      note: "Coordinate approximants on a compact Euclidean set combine through a finite dependent index into one hidden layer with vector output coefficients. Coordinate errors ε/(output+1) give strict error in the Euclidean norm, including zero output dimension. Finite-feature reduction followed by ridge approximation uses half the tolerance at each step. The activation need not be globally Lipschitz, and the target is specified on the compact set."
    - source: "Remark 4.3, finite Fourier approximation of averaging kernels"
      module: "KVApproximation.NeuralOperators.FourierProjectionApproximation"
      comparator_config: "Comparator/fourier_projection_approximation.json"
      note: "For each real L² kernel and positive ε, a finite conjugate-symmetric Fourier projection approximates its vector-valued integral with error at most ε times the input L² norm. A rectangle contains the threshold set from unconditional Fourier convergence. Complexification, representatives and the bilinear L² pairing identify the projection without a channel-dimension factor. Hölder integrability justifies the integral interchanges. Empty channels, zero-dimensional cells and zero kernels are included."
    - source: "Remark 4.3, finite continuous features"
      module: "KVApproximation.Approximation.FiniteFeatures"
      comparator_config: "Comparator/finite_features.json"
      note: "A separating family of real continuous observations on a compact space approximates each real continuous target through finitely many observations and a globally continuous function of them. The finite-feature subalgebra and Stone–Weierstrass give the result. Empty parameter and feature spaces are included."
    - source: "Remark 4.3, uniform local averaging"
      module: "KVApproximation.Analysis.UniformLocalAverage"
      comparator_config: "Comparator/uniform_local_average.json"
      note: "A jointly continuous compact family on a compact metric space admits uniform approximation of a prescribed evaluation by averages over one positive-measure ball. The measure is finite and positive on nonempty open sets. Currying into the uniform norm gives the estimate, and Bochner integrability justifies subtracting the center value. Empty parameter spaces, zero targets and isolated evaluation points are included."
    - source: "Example 2.1 and Remark 4.3, Lipschitz composition on Lp"
      module: "KVApproximation.Analysis.Nemytskii"
      comparator_config: "Comparator/nemytskii.json"
      note: "Centering at zero, applying Lipschitz composition and restoring a constant gives an Lp map with the same Lipschitz constant on finite measure spaces. The result applies for p=∞ and zero measure, and for targets without completeness or separability assumptions."
    - source: "Example 2.1 and Remark 4.3, bounded linear Fourier coefficients"
      module: "KVApproximation.Analysis.PeriodicFourierFunctionals"
      comparator_config: "Comparator/periodic_fourier_functionals.json"
      note: "Complex coordinate coefficients define continuous real-linear functionals on Euclidean L². The Hilbert-basis identity uses the positive mode in the first inner-product slot and gives the negative-frequency integral. Scalar restriction and coordinate embedding preserve normalized cell measure. Injectivity of the complex Hilbert-basis representation in each real coordinate gives Fourier separation, including dimension zero and empty coordinate types."
    - source: "Example 2.1 and Remark 4.3, bounded linear Fourier projection"
      module: "KVApproximation.NeuralOperators.FourierMappingProjection"
      comparator_config: "Comparator/fourier_mapping_projection.json"
      note: "Finite weighted sums of coefficient maps, real-part extraction and Euclidean coordinate assembly define the Fourier projection on L² fields. Empty channels and dimension zero are included."
    - source: "Example 2.1 and Remark 4.3, affine Fourier layer"
      module: "KVApproximation.NeuralOperators.FourierMappingAffine"
      comparator_config: "Comparator/fourier_mapping_affine.json"
      note: "A local matrix, finite Fourier synthesis and constant bias define an affine map between Euclidean L² spaces. Real and imaginary coefficient parts multiply the corresponding real Fourier fields. Representative identities give the finite sums, scalar multiples and constant offset."
    - source: "Example 2.1 and Remark 4.3, Lipschitz Fourier layers and chains"
      module: "KVApproximation.NeuralOperators.FourierMappingLayers"
      comparator_config: "Comparator/fourier_mapping_layers.json"
      note: "Coordinate activation preserves the scalar Lipschitz constant in the Euclidean channel norm. Nemytskii composition with the affine field gives a globally Lipschitz layer; composition gives finite chains. Empty chains, zero widths and nonzero activation offsets are included."
    - source: "Remark 4.3, global Lipschitz continuity of the Fourier mapping"
      module: "KVApproximation.NeuralOperators.FourierMappingLipschitz"
      comparator_config: "Comparator/fourier_mapping_lipschitz.json"
      note: "The lifting combines a constant vector contribution and pointwise linear field contribution on the ordinary product input norm. Almost-everywhere chain identities and projection congruence identify the Fourier mapping, followed by the finite-dimensional linear output. FourierMappingApproximation establishes universality separately."
    - source: "Remark 4.3, vector-valued finite-feature reduction"
      module: "KVApproximation.Approximation.VectorFiniteFeatures"
      comparator_config: "Comparator/vector_finite_features.json"
      note: "A finite union of coordinate observation sets and continuous Euclidean assembly give strict approximation error using coordinate tolerance ε/(n+1)."
    - source: "Example 2.1 and Remark 4.3, linear lifting of vector and field inputs"
      module: "KVApproximation.NeuralOperators.ChannelLifting"
      comparator_config: "Comparator/channel_lifting.json"
      note: "Constant-vector and pointwise-field components define the continuous linear L² map. Finite basis coordinates select an injective lifting; normalized nonzero cell measure recovers the vector component, and Lp extensionality recovers the field. FourierMappingLipschitz uses this construction."
    - source: "Remark 4.3, exact finite-feature Fourier layer"
      module: "KVApproximation.NeuralOperators.FourierFeatureLayer"
      comparator_config: "Comparator/fourier_feature_layer.json"
      note: "Real weighted sums of scalar projection matrices define a conjugate-symmetric multiplier on a common rectangle, with zero local matrix and a constant bias. Finite sum rearrangement gives the origin identity. Coefficient maps and cancellation of the local term give joint continuity of the hidden field. Empty features, zero widths and a zero-dimensional cell are included."
    - source: "Remark 4.3, finite-dimensional ridge approximation"
      module: "KVApproximation.Approximation.RidgeApproximation"
      comparator_config: "Comparator/ridge_approximation.json"
      note: "Finite weighted sums of smooth activations, with Euclidean weights and biases, uniformly approximate a continuous target on a compact set. Six licensed sources from Neural Network Proofs supply the derivative and ridge-density arguments. The project connects the closed continuous span to uniform approximation and extracts finite parameters using Submodule.mem_span_set'. Smoothness is C∞. FourierMappingApproximation applies this result to the constant-bias architecture. Attribution is in Vendor/NOTICE.md."
