      comparator_config: "Comparator/homogenized_superposition.json"
      note: "The of_sub corollary identifies the prepared initial load, L² forcing and Sobolev trajectory after superposition. It applies the addition theorem and transports the resulting equation through three equalities. ForcedSubsequence uses this normalization in the forcing limit."
    - source: "Proposition 4.7, smooth periodic bump and derivative support"
