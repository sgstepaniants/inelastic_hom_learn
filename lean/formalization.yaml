      comparator_config: "Comparator/periodic_slicing.json"
      note: "Normal face traces and transverse cancellation give the dimension-independent bound 2M for an open coordinate strip of width between zero and one. Joint integrability justifies Fubini. The periodic Euclidean lift supplies derivatives at seams, and compact continuity gives fixed-face integrability."
    - source: "Proposition 4.7, normalized coordinate replacement for periodic slicing"
      module: "KVApproximation.Analysis.PeriodicCoordinateUpdate"
      comparator_config: "Comparator/periodic_coordinate_update.json"
      note: "Replacing one torus coordinate by an independent normalized circle coordinate preserves product Haar measure. The map is a continuous surjective additive homomorphism, and probability normalization identifies the pushforward."
    - source: "Proposition 4.7, finite-exponent convergence of strip coefficients"
