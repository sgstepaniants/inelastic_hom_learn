      note: "The strip family has admissible-material witnesses at radii norm(I)+1 and 4 norm(I)+1, with the identity/strip representatives, L² material convergence and both L¹ limits. Representative transfer uses almost-everywhere equality. The limiting elasticity retains the bounds 1 and 2."
    - source: "Proposition 4.7, concrete uniform strip BV bounds"
