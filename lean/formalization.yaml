      comparator_config: "Comparator/fourier_mapping_lp.json"
      note: "Euclidean channel coordinates, finite continuous Fourier synthesis and constant biases define the affine L² field. Centering the activation at zero permits Lipschitz composition; restoring the constant allows arbitrary activation offsets. Chain induction includes empty chains and empty channels."
    - source: "Example 2.1, reality of Fourier layers and projection"
