      comparator_config: "Comparator/periodic_bump.json"
      note: "Derivatives vanish outside topological support through the continuous Euclidean quotient map. A scalar bump composed with the centered periodic cosine gives a C∞ field with range [0,1], attaining one and supported in any strip of width 0<a≤1. The strict cosine threshold gap controls the closure and periodic seam."
