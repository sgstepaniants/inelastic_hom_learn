      comparator_config: "Comparator/fourier_mapping_reality.json"
      note: "Conjugation of real-input Fourier coefficients and sign reversal of the rectangular frequency set identify each finite sum with its conjugate. The layer also conjugates its spatial Fourier factor. The L² hypotheses cover zero modes, zero-dimensional cells and empty channels."
    - source: "Example 2.1, representative independence of Fourier neural mappings"
      module: "KVApproximation.NeuralOperators.FourierMappingRepresentatives"
      comparator_config: "Comparator/fourier_mapping_representatives.json"
      note: "Integral congruence gives equality of Fourier coefficients, and the local term preserves almost-everywhere equality. Chain induction and projection then give equal outputs. Activation regularity is unnecessary for these congruence results; L² preservation, reality, Lipschitz bounds and approximation have separate modules."
    - source: "Proposition 4.7, exact spectral edges for identity and strip materials"
      module: "KVApproximation.KelvinVoigt.StripSpectralEdges"
      comparator_config: "Comparator/strip_spectral_edges.json"
      note: "Equal coefficient fields give identity relaxation, with the stored elasticity upper bound two. A localized unit corrector is an eigenvector with eigenvalue two for the strip operator; the full-spectrum upper bound gives equality of the spectral edge. The eigenvalue argument applies without a finite-dimensional or compact-operator hypothesis."
    - source: "Proposition 4.7, identity and jump formulas for cell relaxation"
      module: "KVApproximation.Homogenization.CellRelaxationIdentities"
      comparator_config: "Comparator/cell_relaxation_identities.json"
      note: "Equal fields give identity relaxation independently of stored bounds. For identity viscosity and an identity tensor jump, L² restriction gives Rη=η+P_Vξ. Field-to-form equality, Riesz inverse cancellation, representatives and projection identities give the formulas. The representative identities supply the required set information; the strip application supplies its support."
    - source: "Proposition 4.7, mean subtraction and nonzero symmetric gradient"
      module: "KVApproximation.Analysis.PeriodicNonconstantStrain"
      comparator_config: "Comparator/periodic_nonconstant_strain.json"
      note: "Subtracting the mean preserves the strain of a nonconstant C¹ periodic displacement. Periodic Korn and full support of product Haar measure give nonzero L² strain, with the inherited norm."
    - source: "Proposition 4.7, localized unit strain corrector"
      module: "KVApproximation.Homogenization.LocalizedCorrectors"
      comparator_config: "Comparator/localized_correctors.json"
      note: "For each width 0<a≤1, a smooth bump, coordinate vector, mean removal, derivative locality and norm scaling produce a zero-mean displacement whose strain corrector has L² norm one and vanishes almost everywhere off the strip. The construction is independent of coefficient and spectral assumptions."
