      comparator_config: "Comparator/strip_bv.json"
      note: "The symbolic Frobenius identity norm gives the Lp bound 2 norm(I) for all exponents, strip variation bound 2 norm(I), constant BV norm norm(I), and strip BV bound 4 norm(I). Normalized mass and the generic variation theorem give the estimates."
    - source: "Proposition 4.7, uniform variation of periodic strip fields"
