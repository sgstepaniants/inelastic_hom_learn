      comparator_config: "Comparator/periodic_strip_variation.json"
      note: "Constant fields have zero variation. A constant plus a coordinate-strip jump has variation at most twice the jump norm, for complete real Hilbert targets and widths from zero to one. Integrability justifies finite-sum, projection and inner-product interchange; transverse terms cancel before estimating the normal derivative."
    - source: "Proposition 4.7, coordinate slices and strip derivative bound"
