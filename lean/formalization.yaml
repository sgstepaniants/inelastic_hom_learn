fidelity:
  divergences: "The smoother-class results give compact L² closure, with closedness required for compactness of the class itself. The lifting activation is globally Lipschitz to define a map on all L² inputs; the finite-dimensional output requires local Lipschitz regularity. Universal approximation uses the shared-activation Fourier subfamily, while ActivatedFourierChain also represents layer-dependent activations. The linear-surrogate identities apply after subtraction of affine offsets."
