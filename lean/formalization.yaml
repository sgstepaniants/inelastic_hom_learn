      comparator_config: "Comparator/forced_subsequence.json"
      note: "The compactness and identification result gives an H¹ limit with the prescribed closed-interval traces, Green operator, load balance and homogenized weak equation. Its hypotheses supply the required compactness and estimates, without a separate bounded-domain assumption."
