name = "kvApproximation"
version = "0.1.0"
defaultTargets = ["KVApproximation", "TauCeti", "ForTauCeti", "NeuralNetworkProofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "LeanCert"
git = "https://github.com/alerad/leancert.git"
rev = "v4.35.0"

[[lean_lib]]
name = "KVApproximation"
globs = ["KVApproximation.*"]

[[lean_lib]]
name = "TauCeti"
srcDir = "Vendor"
globs = ["TauCeti.+"]

[[lean_lib]]
name = "ForTauCeti"
srcDir = "Vendor"
globs = ["ForTauCeti.+"]

[[lean_lib]]
name = "Challenges"
srcDir = "Comparator"
globs = ["Challenges.+"]

[[lean_lib]]
name = "NeuralNetworkProofs"
srcDir = "Vendor"
globs = ["NeuralNetworkProofs.+"]
